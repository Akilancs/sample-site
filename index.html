<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="todo-container">
    <h1>To-Do List</h1>

    <form id="task-form" class="task-form">
      <label for="task-input" class="sr-only">Enter a task</label>
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        autocomplete="off"
      >
      <label for="deadline-input" class="deadline-label"></label>
      <input type="date" id="deadline-input" aria-label="Task deadline">
      <button type="submit">Add Task</button>
    </form>
    <p id="form-message" class="form-message" aria-live="polite"></p>

    <p id="empty-state" class="empty-state">No tasks yet. Add one above!</p>
    <ul id="task-list" class="task-list"></ul>
  </main>
</body>
</html>
